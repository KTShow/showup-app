<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Options</title>
<style>
body{margin:0;padding:16px;font-family:-apple-system,Helvetica,sans-serif;background:#E8DDD0;color:#3A3A3A}
h1{font-family:Georgia,serif;color:#6B2D4E;font-size:20px;margin:4px 0 14px}
.opt{display:flex;align-items:center;gap:14px;background:#FBF7F2;border-radius:14px;padding:12px;margin-bottom:12px}
.opt img{border-radius:22.5%}
.big{width:96px;height:96px}.sm{width:60px;height:60px}.xs{width:40px;height:40px}
.t{font-weight:700;font-size:15px}.s{font-size:12px;color:#6A6A6A;margin-top:2px}
.home{background:linear-gradient(180deg,#3b5a7a,#c98a5a);border-radius:22px;padding:18px;display:grid;grid-template-columns:repeat(4,60px);gap:16px;justify-content:center}
.home img{width:60px;height:60px;border-radius:13.5px}
.home div{color:#fff;font-size:11px;text-align:center}
</style></head><body>
<h1>Pick the fold color</h1>
<div class="opt"><img class="big" src="current-180.png"><img class="sm" src="current-180.png"><img class="xs" src="current-180.png"><div><div class="t">1. Official gold (now)</div><div class="s">Blends into terracotta</div></div></div>
<div class="opt"><img class="big" src="bright-180.png"><img class="sm" src="bright-180.png"><img class="xs" src="bright-180.png"><div><div class="t">2. ChatGPT gold</div><div class="s">A little brighter</div></div></div>
<div class="opt"><img class="big" src="butter-180.png"><img class="sm" src="butter-180.png"><img class="xs" src="butter-180.png"><div><div class="t">3. Butter gold</div><div class="s">Clear against both</div></div></div>
<div class="opt"><img class="big" src="sand-180.png"><img class="sm" src="sand-180.png"><img class="xs" src="sand-180.png"><div><div class="t">4. Light sand</div><div class="s">Official, but close to cream</div></div></div>
<h1>Side by side on a home screen</h1>
<div class="home">
 <div><img src="current-180.png">1</div><div><img src="bright-180.png">2</div><div><img src="butter-180.png">3</div><div><img src="sand-180.png">4</div>
</div>
</body></html>
