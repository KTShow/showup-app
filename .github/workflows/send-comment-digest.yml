name: Send weekly comment recap

# Weekly email recap of comments for people without phone alerts.
# See scripts/send-comment-digest.mjs.

# Sundays. The first scheduled send is Oct 18, 2026 (41 people got an early
# recap Wed Oct 7, so Oct 11 is skipped -- see FIRST_SEND in the script).
on:
  schedule:
    - cron: '0 21 * * 0' # Sundays 21:00 UTC (5pm ET summer, 4pm ET winter)
  workflow_dispatch:
    inputs:
      only_email:
        description: 'Preview: send one recap to just this email (leave blank = real run for everyone)'
        required: false
        default: ''
      send_to_everyone:
        description: 'REAL SEND to everyone eligible (unticked + no email above = just list who would get one)'
        type: boolean
        default: false

concurrency:
  group: send-comment-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Zero npm dependencies, so the runner's preinstalled Node is fine.
      - name: Send recaps
        run: node scripts/send-comment-digest.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ONLY_EMAIL: ${{ inputs.only_email }}
          # A manual run only sends for real to everyone when the box is ticked;
          # otherwise (no preview email) it's a dry run that just lists who.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.only_email == '' && !inputs.send_to_everyone && '1' || '' }}
